<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">Smart Attendance</a>
    {% if session.get('user_id') %}
    <div>
      <a class="btn btn-sm btn-outline-light me-1" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{{ url_for('students') }}">Students</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{{ url_for('attendance') }}">Attendance</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{{ url_for('reports') }}">Reports</a>
      <a class="btn btn-sm btn-warning" href="{{ url_for('logout') }}">Logout</a>
    </div>
    {% endif %}
  </div>
</nav>
<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
