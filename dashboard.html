{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<p class="text-muted">Date: {{ today }}</p>
<div class="row g-3">
  <div class="col-md-4"><div class="card shadow-sm p-4"><h5>Total Students</h5><h2>{{ total_students }}</h2></div></div>
  <div class="col-md-4"><div class="card shadow-sm p-4"><h5>Present Today</h5><h2>{{ present_today }}</h2></div></div>
  <div class="col-md-4"><div class="card shadow-sm p-4"><h5>Total Attendance Records</h5><h2>{{ total_records }}</h2></div></div>
</div>
{% endblock %}
