{% extends "base.html" %}
{% block content %}
<h2>Attendance Report</h2>
<div class="table-responsive">
<table class="table table-bordered table-striped">
<thead><tr><th>Roll No</th><th>Name</th><th>Department</th><th>Present</th><th>Total</th><th>Percentage</th></tr></thead>
<tbody>
{% for r in reports %}
<tr>
<td>{{ r.roll_no }}</td><td>{{ r.name }}</td><td>{{ r.department }}</td>
<td>{{ r.present }}</td><td>{{ r.total }}</td><td><strong>{{ r.percentage }}%</strong></td>
</tr>
{% else %}
<tr><td colspan="6" class="text-center">No report data.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
